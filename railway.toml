[build]
builder = "NIXPACKS"
# Install only. Do not run `next build` — this service is the live-tip
# worker, not the Vercel app. `npm install` stays in sync when scripts
# change; `npm ci` aborts if the lockfile lags package.json.
buildCommand = "npm install"

[deploy]
startCommand = "npm run worker"
numReplicas = 1
# ALWAYS: a crash or unexpected exit 0 must come back. ON_FAILURE left the
# worker dead after a clean-looking exit. Lock waits already retry in-process;
# this is the platform net for uncaught exits. One replica only.
restartPolicyType = "ALWAYS"
