name: typecheck
on:
  pull_request:
  push:
    branches: [master]
jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # Lockfile is ahead of some transitive deps locally; npm ci fails
      # before tsc and would hide the actual typecheck this gate exists for.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
